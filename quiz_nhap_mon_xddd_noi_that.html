let index=0, score=0, selected=null, time=20, timer=null, answers=[];

function startQuiz(){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  index=0; score=0; answers=[]; loadQuestion();
}
function loadQuestion(){
  clearInterval(timer); time=20; selected=null;
  const item=questions[index];
  document.getElementById('category').textContent=item.category;
  document.getElementById('num').textContent=index+1;
  document.getElementById('time').textContent=time;
  document.getElementById('bar').style.width=((index)/questions.length*100)+'%';
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options'); box.innerHTML='';
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('next').textContent=index===questions.length-1?'Nộp bài ✓':'Câu tiếp theo →';
  item.options.forEach((opt,i)=>{
    const label=document.createElement('label');
    label.className='option';
    label.innerHTML='<input type="radio" name="answer" value="'+i+'"><span><b>'+String.fromCharCode(65+i)+'.</b> '+escapeHtml(opt)+'</span>';
    label.onclick=()=>{selected=i};
    box.appendChild(label);
  });
  timer=setInterval(()=>{
    time--; document.getElementById('time').textContent=time;
    if(time<=0){clearInterval(timer); recordAnswer(null); showFeedback();}
  },1000);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function recordAnswer(value){
  if(answers[index]!==undefined) return;
  const correct=questions[index].answer;
  answers[index]=value;
  if(value===correct) score++;
}
function showFeedback(){
  const item=questions[index];
  const opts=document.querySelectorAll('.option');
  opts.forEach((el,i)=>{
    el.onclick=null;
    if(i===item.answer) el.classList.add('correct');
    if(selected!==null && i===selected && selected!==item.answer) el.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  if(selected===item.answer) fb.textContent='✅ Chính xác!';
  else if(selected===null) fb.textContent='⏰ Hết giờ. Đáp án đúng: '+String.fromCharCode(65+item.answer)+'.';
  else fb.textContent='❌ Chưa đúng. Đáp án đúng: '+String.fromCharCode(65+item.answer)+'.';
  fb.classList.remove('hidden');
}
function nextQuestion(){
  clearInterval(timer);
  if(answers[index]===undefined) recordAnswer(selected);
  showFeedback();
  setTimeout(()=>{
    if(index<questions.length-1){index++;loadQuestion();}
    else finish();
  },450);
}
function skipQuestion(){
  clearInterval(timer);
  if(answers[index]===undefined) recordAnswer(null);
  if(index<questions.length-1){index++;loadQuestion();} else finish();
}
function finish(){
  clearInterval(timer);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').style.display='block';
  document.getElementById('bar').style.width='100%';
  const wrong=questions.length-score;
  document.getElementById('score').textContent=score+' / '+questions.length;
  document.getElementById('correctCount').textContent='Đúng: '+score;
  document.getElementById('wrongCount').textContent='Sai/chưa trả lời: '+wrong;
  document.getElementById('percent').textContent='Tỷ lệ đúng: '+Math.round(score/questions.length*100)+'%';
  const review=document.getElementById('review'); review.innerHTML='<h3>Xem lại đáp án</h3>';
  questions.forEach((q,i)=>{
    const your=answers[i];
    const ok=your===q.answer;
    const yourText=your===null||your===undefined?'Chưa trả lời':String.fromCharCode(65+your);
    review.innerHTML+=`<div class="review-item"><b>Câu ${i+1}.</b> ${escapeHtml(q.q)}<br><span class="${ok?'ok':'bad'}">${ok?'✓ Đúng':'✗ Sai'} — Bạn chọn: ${yourText} | Đáp án: ${String.fromCharCode(65+q.answer)}</span></div>`;
  });
}
function restart(){
  document.getElementById('result').style.display='none';
  document.getElementById('start').classList.remove('hidden');
  document.getElementById('bar').style.width='0%';
}
</script>
